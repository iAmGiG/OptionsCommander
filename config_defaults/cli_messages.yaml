# ============================================================================
# CLI Messages Configuration
# Centralized YAML configuration for all CLI user-facing messages
# ============================================================================

# Emojis used throughout the CLI
emojis:
  # Mode indicators
  auto_mode: "🤖"
  confirm_mode: "✋"

  # Status indicators
  success: "✅"
  error: "❌"
  warning: "⚠️"
  info: "📊"
  critical: "🚨"
  loading: "⏳"
  thinking: "💭"

  # Trading signals
  buy: "⬆️"
  sell: "⬇️"
  hold: "➡️"
  check: "✅"

  # Position status
  profit: "🟢"
  loss: "🔴"
  neutral: "⚪"

  # Feature icons
  portfolio: "💼"
  money: "💰"
  chart: "📈"
  orders: "📋"
  alerts: "🔔"
  scheduler: "⏰"
  calendar: "📅"
  clock: "🔮"
  config: "⚙️"
  target: "🎯"
  history: "📜"
  book: "📖"
  lightbulb: "💡"
  wave: "👋"
  lightning: "⚡"
  retry: "🔄"

  # Time of day
  morning: "🌅"
  evening: "🌆"

# Welcome and help messages
welcome:
  banner: "======================================================================"
  title: "   AutoGen Trading Assistant - Unified Interactive CLI"

help:
  commands: |
    System Commands:
      /help      - Show help
      /exit      - Exit (or Ctrl+C)
      /toggle    - Toggle between CONFIRM and AUTO modes
      /schedule  - Enter scheduler management mode
      /tips      - Show trading basics for beginners

    Trading:
      > buy 10 AAPL
      > is SPY at $XXX.XX a good entry?
      > sell all TQQQ
      > pltr                        (just type ticker for analysis)

    Monitoring:
      > check my alerts
      > show portfolio
      > any open orders
      > what's my position status?

    Scheduler:
      > show scheduler status
      > show execution history
      Or use /schedule for full scheduler CLI

    Tip: Just type naturally - the LLM will understand!
         New to trading? Type /tips to learn the basics!

# Mode switching messages
mode:
  switched_auto: "🤖 Mode switched to: AUTO (trades execute immediately)"
  switched_confirm: "✋ Mode switched to: CONFIRM (asks before executing)"

# Exit messages
exit:
  message: "\n\n👋 Exiting..."

# Command messages
commands:
  unknown: "Unknown command: {command}"
  use_help: "Use /help to see available commands"

# Trade request messages
trade:
  analyzing: "\n⏳ Analyzing trade..."
  auto_executing: "\n⚡ Auto-executing..."
  cancelled: "\n❌ Trade cancelled"

  sell_warning: |
    ⚠️  WARNING: SELL signal detected.
       This system does not support short selling.
       Only SELL if you currently hold this position.
       Otherwise, ignore this signal.

# Error messages
errors:
  processing: "\n❌ Error processing request: {error}"

  invalid_ticker: |
    ❌ Invalid ticker symbol
       The ticker you entered was not recognized by the market.
       Please check the spelling and try again.
       Example: AAPL (not APPL), TSLA, SPY, MSFT

  garbage_input: |
    ❌ I couldn't understand that request.
       Try:
       • A ticker symbol: 'AAPL' or 'meta'
       • A trade request: 'buy 10 SPY' or 'sell all TSLA'
       • Status query: 'show portfolio' or 'check orders'
       • Type /help for more options

  empty_ticker: |
    ❌ No ticker symbol detected.
       Please specify what you want to trade.
       Examples: 'AAPL', 'buy META', 'analyze TSLA'

  # Broker error translations (src/trading/broker/api_error_translator.py)
  market_closed:
    title: "Order rejected: Market is closed"
    desc: "Regular market hours: 9:30 AM - 4:00 PM ET. Your order may execute when the market opens."

  generic:
    title: "Order failed for {ticker}"
    desc: "Please try again during market hours or contact support if the issue persists."

  bracket:
    stop_loss:
      title: "Order rejected: Stop loss price ({stop}) doesn't match market price"
      desc: >-
        The market is closed and price data may be stale. Entry: {entry}, Stop: {stop},
        Alpaca expects stop={base}. Try again during market hours (9:30 AM - 4:00 PM ET)
        for accurate pricing.
    take_profit:
      title: "Order rejected: Take profit price ({target}) doesn't match market price"
      desc: >-
        The market is closed and price data may be stale. Entry: {entry}, Target: {target},
        Alpaca expects target>={base}. Try again during market hours (9:30 AM - 4:00 PM ET)
        for accurate pricing.

  buying_power:
    title: "Order rejected: Not enough cash available"
    desc: "Check your account balance and reduce the order size."

  invalid_symbol:
    title: "Order rejected: {ticker} is not a valid or tradeable symbol"
    desc: "Double-check the ticker symbol. It may be delisted or not supported by Alpaca."

# Trade suggestion display
suggestion:
  separator: "======================================================================"
  header: "📊 {ticker} @ ${price:.2f}"
  signal_display: "{emoji} {signal} SUGGESTED"
  confidence: "   Confidence: {confidence:.1%}"

  analysis_header: "\n📈 Analysis ({timeframe} timeframe):"
  analysis_item: "   • {reason}"

  entry_plan_header: "\n💰 Entry Plan:"
  entry_plan: |
    Direction: {direction}
    Entry:  ${entry:.2f}
    Stop:   ${stop:.2f} ({stop_pct:+.1f}%)
    Target: ${target:.2f} ({target_pct:+.1f}%)
    Qty:    {qty} shares
    Order:  {tif}

  portfolio_impact_header: "\n📊 Portfolio Impact:"
  portfolio_impact: |
    Trade Value: ${trade_value:,.2f}
    Portfolio %: {portfolio_pct:.1f}% (after transaction)
    Max Loss:    ${max_loss:.2f}
    Risk/Reward: {risk_reward:.2f}

  warnings_header: "\n⚠️  Warnings:"
  warning_item: "   {warning}"

# Confirmation messages
confirmation:
  prompt: "\nPlace this order? [yes/no]: "
  invalid: "Please enter 'yes' or 'no'"

# Order result messages
order_result:
  separator: "======================================================================"

  success_header: "✅ ORDER PLACED SUCCESSFULLY"
  success: |

    {qty} shares {ticker}
    Entry Order:  {entry_id}
    Stop Order:   {stop_id}
    Target Order: {target_id}

    {message}

  failed_header: "❌ ORDER FAILED"
  failed: |

    {message}

  error_detail: "   Error: {error}"

# Alerts messages
alerts:
  checking: "\n📊 Checking Position Alerts..."
  not_initialized: "❌ Trading cycle not initialized"
  no_alerts: "✅ No active alerts"
  positions_monitored: "   {count} position(s) monitored"

  header: "\n🔔 {count} Alert(s) Generated:"
  alert_item: |
    {emoji} {ticker}: {alert_type}
       Current: ${price:.2f}
  alert_detail: "      {key}: {value}"
  history_header: "\n📜 Alert History ({count} total):"
  history_item: "   • {ticker} - {alert_type} at {time}"

  error: "❌ Error checking alerts: {error}"

# Scheduler messages
scheduler:
  header: "\n⏰ Daily Scheduler Status"
  separator: "======================================================================"

  not_initialized: |
    ❌ Scheduler not initialized - not running in daemon mode

    💡 To start scheduler:
       python main.py --daemon

    📖 What the scheduler does:
       • Morning (9:20 AM ET): Check positions, place new orders
       • Evening (3:50 PM ET): Review positions, adjust stops

  status: "\n{emoji} Status: {status}"

  config_header: "\n⚙️  Configuration:"
  config: |
    Morning Routine: {morning} ET
    Evening Routine: {evening} ET
    Max Retries: {retries}
    Timezone: US/Eastern

  routines_header: "\n📅 Scheduled Routines:"

  morning_routine: |

    🌅 Morning Routine (9:20 AM ET):
       • Fetch current broker state
       • Check position alerts (approaching TP/SL)
       • Analyze market conditions
       • Place new GTC orders if signals present
       • Log execution status

  evening_routine: |

    🌆 Evening Routine (3:50 PM ET):
       • Review all open positions
       • Check alert triggers
       • Adjust trailing stops if profitable
       • Update position tracker state
       • Log daily summary

  history_header: |
    📋 Recent Execution History:
       (Last 7 days, showing up to 10 most recent)

  history_item: |

    {emoji} {task}
       Status: {status}
       Time: {time}

  error_detail: "      ⚠️  Error: {error}..."
  retries: "      🔄 Retries: {count}"

  no_history: |
    📋 No execution history found
       Scheduler hasn't run yet or history is empty

  next_header: "\n🔮 Next Scheduled Execution:"
  next: |
    {task}
    Time: {time} ET
    Countdown: {hours}h {minutes}m from now
  next_error: "   Unable to calculate next run: {error}"
  commands: |
    💡 Scheduler Commands:
       python main.py --daemon      # Run scheduler in background
       python main.py --help        # See all options

    📖 Documentation:
       docs/features/02_gtc_scheduler_quickstart.md
       docs/features/03_gtc_scheduler_technical.md

  error: "❌ Error checking scheduler: {error}"

# Portfolio messages
portfolio:
  header: "\n💼 Portfolio Status..."
  not_initialized: "❌ Account monitor not initialized"

  account_header: "\n💰 Account:"
  account_info: |
    Equity: ${equity:,.2f}
    Cash: ${cash:,.2f}
    Buying Power: ${buying_power:,.2f}
    Pattern Day Trader: {pdt}

  positions_header: "\n📊 Positions ({count}):"
  position_item: |
    {emoji} {symbol}: {qty} shares @ ${entry:.2f} (avg entry)
       Current: ${current:.2f}
       Value: ${value:,.2f}
       P/L: ${pl:,.2f} ({pl_pct:+.2f}%)

  position_details_header: "\n{emoji} {symbol} Position Details:"
  position_details: |
    Quantity: {qty} shares
    Entry Price: ${entry:.2f}
    Current Price: ${current:.2f}
    P/L: ${pl:,.2f} ({pl_pct:+.2f}%)

  price_targets_header: "\n🎯 Price Targets:"
  price_targets: |
    Take Profit: ${tp:.2f}
    Stop Loss: ${sl:.2f}
    Distance to TP: {tp_dist:+.2f}%
    Distance to SL: {sl_dist:+.2f}%

  no_targets: "\n💡 No price targets set for {symbol}"
  no_position: "\n❌ No position found for {ticker}"
  no_positions: "\n📊 No open positions"

  error: "❌ Error checking portfolio: {error}"

# Orders messages
orders:
  checking: "\n📋 Checking Open Orders..."
  not_initialized: "❌ Account monitor not initialized"
  no_orders: "✅ No open orders"

  header: "\n📊 {count} Open Order(s):"
  order_item: |
    {emoji} {side} {qty} {symbol} {price}
       Type: {type}, Status: {status}
       Order ID: {order_id}...

  error: "❌ Error checking orders: {error}"

# Execution manager messages
execution:
  # Initialization
  init_with_manager: "AlpacaExecutionManager initialized with OrderManager"
  init_without_manager: "AlpacaExecutionManager initialized without OrderManager (stub mode)"
  strategy_config: "Using strategy config: stop_loss={stop_loss_pct}%, take_profit={take_profit_pct}%"
  price_fetcher_available: "UnifiedPriceFetcher available - will fetch current prices before execution"
  price_fetcher_unavailable: "UnifiedPriceFetcher NOT available - will use suggestion prices"

  # Market hours
  market_hours_check_failed: "Could not determine market hours: {error}"
  market_closed_warning: |
    Market is CLOSED (weekend/off-hours).
    Bracket orders may fail validation during off-hours.

  # Price fetching
  price_fetch_alpaca_failed: "Could not fetch current price from Alpaca market data: {error}"
  price_fetch_unified_failed: "UnifiedPriceFetcher failed: {error}"

  # Position checks
  position_found: "Found position: {qty} shares of {ticker}"
  position_check_failed: "Could not check positions: {error}"

  # SELL signal rejections
  sell_no_position: "SELL signal rejected: No position in {ticker}. Short selling not supported."
  sell_exceeds_position: "SELL quantity ({qty}) exceeds position ({position_qty} shares)"

  # Order execution
  bracket_order_success: "Bracket order placed: {signal} {qty} {ticker} (mode: {mode})"

  # Bracket order validation failures (off-hours)
  bracket_validation_failed: |
    Bracket order validation failed (off-hours): {error}
    Error code: {error_code}, Status: {status_code}
    Attempting fallback: simple market order without brackets...

  fallback_order_success: |
    Simple market order placed: {order_id}
    NOTE: Stop-loss and take-profit NOT set (bracket order failed).
    Manual risk management required!
    Target: ${target:.2f}, Stop: ${stop:.2f}

  fallback_order_warning: "⚠️  Market order placed WITHOUT brackets (off-hours fallback). Target: ${target:.2f}, Stop: ${stop:.2f} (NOT automatically set). Manual risk management required!"

  fallback_order_failed: "Both bracket and fallback market orders failed during off-hours"

  # Stub mode
  stub_order: "[STUB] {signal} {qty} {ticker} @ ${price:.2f}"

  # Order cancellation
  cancel_no_manager: "Cannot cancel - no OrderManager (stub mode)"
  order_cancelled: "Order cancelled: {order_id}"
  cancel_failed: "Failed to cancel order {order_id}: {error}"

  # Order status
  status_no_manager: "Cannot get status - no OrderManager (stub mode)"
  status_failed: "Failed to get order status {order_id}: {error}"
