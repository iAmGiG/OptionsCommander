/schedule:
  category: System
  description: 'Scheduler management: status, notices, enable and disable'
  usage: /schedule
  examples:
  - /schedule
  aliases: []
  tags:
  - system
  - scheduler
  - slash-command
  related:
  - show scheduler
  - enable scheduler
  - disable scheduler
