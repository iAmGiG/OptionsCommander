# CLI Help Command Documentation
# Read by src/cli/utils/help_system.py for /help. Keep entries in step with the commands:
# tests/unit/cli/test_help_commands.py checks every slash command has one.
# Format: command_name -> {category, description, usage, examples, aliases, tags, related, details}

buy:
  category: Trading
  description: Buy a symbol, after analysis and your confirmation
  usage: buy QUANTITY SYMBOL [at a pullback|on a dip|at a breakout]
  examples:
  - buy 10 AAPL
  - buy AAPL
  - buy QQQ at a pullback
  - buy NVDA at a breakout
  aliases: []
  tags:
  - trading
  - execution
  - timing
  related:
  - sell
  - show orders
  - cancel
  details: 'Analyzes the symbol, then shows the order with its stop and target and asks before placing
    it (CONFIRM mode; /toggle switches to AUTO).

    With no quantity, the trading mode sizes it.

    A pullback, dip or breakout makes it a GTC limit order; otherwise it is a market order, even if you
    give a price.

    If the signal disagrees, the CLI says so and either asks again or places nothing. It never sells when you asked to buy, and
    short selling is refused.'
sell:
  category: Trading
  description: Sell a position you hold, after your confirmation
  usage: sell SYMBOL | sell QUANTITY SYMBOL
  examples:
  - sell SPY
  - sell 5 SPY
  - close my SPY position
  - get out of SPY
  aliases: []
  tags:
  - trading
  - execution
  related:
  - buy
  - show orders
  - cancel
  details: 'Sells at market, after asking. A price is ignored.

    The position''s stop holds its shares, so the stop is cancelled first; if the sale fails, it is put
    back, and after a partial sale the rest get a new stop at the same level.

    When the market is closed, the order fills at the next open.

    You can only sell what you hold; short selling is refused.'
cancel:
  category: Trading
  description: Cancel open orders, after listing them and your confirmation
  usage: cancel orders for SYMBOL | cancel all orders | cancel order ORDER_ID
  examples:
  - cancel orders for TSLA
  - cancel my AAPL orders
  - cancel all orders
  aliases: []
  tags:
  - trading
  - order management
  related:
  - show orders
  - buy
  - sell
  details: 'Lists the orders it would cancel, marks protective stops, and needs a typed ''yes''.

    The request needs cancel, delete or remove plus ''order(s)'', or ''cancel all''.

    An order ID is at least 8 hex characters, including a digit.

    Cancelling a stop leaves its position unprotected until the next routine re-places it.'
show portfolio:
  category: Information
  description: Show the account and each open position
  usage: show portfolio
  examples:
  - show portfolio
  - show my portfolio
  aliases:
  - portfolio
  tags:
  - information
  - portfolio
  related:
  - show positions
  - show orders
  - show account
  details: Shows equity, cash and buying power, then each open position with its P&L.
show positions:
  category: Information
  description: Show open positions
  usage: show positions
  examples:
  - show positions
  - what's my stop on SPY?
  aliases:
  - positions
  - holdings
  tags:
  - information
  - portfolio
  related:
  - show portfolio
  - show orders
  details: 'The same view as ''show portfolio''.

    For one symbol''s orders and stop, ask about it: "what''s my stop on SPY?" or "orders for SPY".'
show orders:
  category: Information
  description: Show open orders
  usage: show orders | orders for SYMBOL
  examples:
  - show orders
  - any open orders?
  - orders for AAPL
  aliases:
  - orders
  tags:
  - information
  - orders
  related:
  - show positions
  - cancel
  - buy
  - sell
  details: 'Lists open orders grouped by symbol, with stops and targets marked.

    Filled and cancelled orders aren''t shown; /records shows the day''s fills.'
show account:
  category: Information
  description: Show trading account status (equity, cash, positions)
  usage: show account | account
  examples:
  - show account
  - account
  aliases:
  - account
  - account info
  tags:
  - information
  - account
  - portfolio
  related:
  - show portfolio
  - show positions
  - list accounts
  details: "Display trading account information:\n  - Account type (paper/live)\n  - Total\
    \ equity\n  - Available cash\n  - Buying power\n  - Pattern Day Trader status\n  - Current\
    \ positions with P&L\n\nNote: This shows your TRADING account status. To list/switch\
    \ between multiple configured accounts, use 'list accounts' or 'show accounts' (plural)."
list accounts:
  category: Configuration
  description: List configured trading accounts
  usage: list accounts | show accounts
  examples:
  - list accounts
  - show accounts
  - list accounts verbose
  aliases:
  - show accounts
  - accounts
  tags:
  - configuration
  - account
  - multi-account
  related:
  - show account
  details: "List all configured trading accounts for multi-account management.\n\nShows:\n  - Account\
    \ IDs\n  - Account types (paper/live)\n  - Discovery status\n\nUse 'switch account <ID>'\
    \ to change active account.\n\nNote: This is for ACCOUNT MANAGEMENT (switching between\
    \ accounts). To see your current account status/positions, use 'show account' (singular)."
change timeframe:
  category: Configuration
  description: 'Change analysis timeframe (Issue #365)'
  usage: change timeframe to {1m|5m|15m|30m|1h|2h|4h|1d|1w|1M}
  examples:
  - change timeframe to 1h
  - set timeframe 4h
  - switch to 5m
  - use 1d timeframe
  aliases:
  - set timeframe
  - switch timeframe
  - use timeframe
  tags:
  - configuration
  - analysis
  - timeframe
  related:
  - show timeframe
  - list timeframes
  - timeframe recommendations
  details: 'Change the active timeframe for technical analysis:


    Scalping (aggressive):     1m, 5m

    Day Trading (intraday):    15m, 30m

    Swing Trading (medium):    1h, 2h, 4h

    Position Trading (default): 1d (the backtested timeframe)

    Long-term:                 1w, 1M


    The timeframe determines the candle period for MACD and RSI indicators.

    Default ''1d'' has been validated with the best performance.'
show timeframe:
  category: Configuration
  description: List the timeframes (the current one is in /timeframe)
  usage: show timeframe
  examples:
  - show timeframe
  aliases: []
  tags:
  - configuration
  - analysis
  - timeframe
  related:
  - /timeframe
  - change timeframe
  - list timeframes
  details: Lists the timeframes. /timeframe shows which one is active.
list timeframes:
  category: Configuration
  description: List all available timeframes
  usage: list timeframes [verbose]
  examples:
  - list timeframes
  - show available timeframes
  - list timeframes verbose
  aliases:
  - show timeframes
  - available timeframes
  tags:
  - configuration
  - analysis
  - timeframe
  related:
  - change timeframe
  - show timeframe
  - timeframe recommendations
  details: 'List all enabled timeframes with optional descriptions.


    Use ''verbose'' to see detailed descriptions of each timeframe.'
timeframe recommendations:
  category: Configuration
  description: Get timeframe recommendations by strategy
  usage: timeframe recommendations
  examples:
  - timeframe recommendations
  - suggest timeframe
  - best timeframe for swing trading
  aliases:
  - suggest timeframe
  - recommend timeframe
  tags:
  - configuration
  - analysis
  - timeframe
  related:
  - change timeframe
  - list timeframes
  details: "Show recommended timeframes grouped by trading strategy:\n\n  Scalping - 1m, 5m (high frequency,\
    \ micro trends)\n  Day Trading - 15m, 30m (intraday swings)\n  Swing Trading - 1h, 2h, 4h (multi-day\
    \ trends)\n  Position Trading - 1d (validated default, best Sharpe)\n  Long-term - 1w, 1M (institutional\
    \ moves)\n\nUse this to find the best timeframe for your trading style."
mode:
  category: Configuration
  description: Show the current trading mode
  usage: mode
  examples:
  - mode
  aliases:
  - show mode
  tags:
  - configuration
  details: 'Display the current trading mode: conservative, moderate or aggressive.

    This determines how your trades are sized and protected.'
set timeframe:
  category: Configuration
  description: Change trading timeframe
  usage: set timeframe {1m|5m|15m|30m|1h|2h|4h|1d|1w|1M}
  examples:
  - set timeframe 1d
  - set timeframe 1h
  - set timeframe 15m
  aliases:
  - timeframe
  tags:
  - configuration
  - timeframe
  - issue-365
  related:
  - show timeframe
  details: "Change the timeframe for technical analysis (Issue #365).\n\nSupported Timeframes:\n  1m,\
    \ 5m, 15m, 30m - Scalping/day trading\n  1h, 2h, 4h        - Intraday swing trading\n  1d        \
    \        - Daily swing/position trading (validated default)\n  1w, 1M            - Position/long-term\
    \ trading\n\n⚠️  Note: Only the 1d timeframe has been backtested.\n   Other timeframes are\
    \ experimental - use with caution.\n\nTimeframe affects:\n  - MACD and RSI calculations\n  - Signal\
    \ generation frequency\n  - Stop loss and take profit levels"
show scheduler:
  category: System
  description: Show daily scheduler status
  usage: show scheduler
  examples:
  - show scheduler
  aliases:
  - scheduler
  - scheduler status
  tags:
  - system
  - scheduler
  - automation
  related:
  - enable scheduler
  - disable scheduler
  details: "Display status of the daily automated scheduler.\n\nShows:\n  - Scheduler state (enabled/disabled)\n\
    \  - Next scheduled run (morning 9:20 AM ET or evening 3:50 PM ET)\n  - Last run time and result\n\
    \  - Configured tasks\n\nThe scheduler automates:\n  - Morning market scan\n  - Position monitoring\n\
    \  - Stop loss adjustments\n  - Evening summary reports"
enable scheduler:
  category: System
  description: Turn the daily scheduler on (in /schedule)
  usage: '/schedule, then: enable'
  examples:
  - /schedule
  aliases: []
  tags:
  - system
  - scheduler
  related:
  - /schedule
  - disable scheduler
  - show scheduler
  details: 'Typing ''enable scheduler'' only shows the scheduler''s status. To turn it on, enter /schedule
    and type ''enable''.

    The routines run at 09:20 and 15:50 ET on trading days. They manage stops and keep records; they never
    open a trade.'
disable scheduler:
  category: System
  description: Turn the daily scheduler off (in /schedule)
  usage: '/schedule, then: disable'
  examples:
  - /schedule
  aliases: []
  tags:
  - system
  - scheduler
  related:
  - /schedule
  - enable scheduler
  - show scheduler
  details: 'Typing ''disable scheduler'' only shows the scheduler''s status. To turn it off, enter /schedule
    and type ''disable''.

    With it off, no routine re-places, renews or raises stops. Positions stay open, and their stops already
    at the broker keep working.'
/voter:
  category: Configuration
  description: Manage ranked voting system
  usage: /voter {list|info|presets|preset|promote|demote|role} [args]
  examples:
  - /voter list
  - /voter list verbose
  - /voter info
  - /voter presets
  - /voter preset default
  - /voter preset macd_primary
  - /voter promote MACD
  - /voter demote RSI
  - /voter role MACD active
  - /voter role RSI review
  aliases:
  - voter
  tags:
  - configuration
  - voting
  - analysis
  - slash-command
  related:
  - /timeframe
  details: "Manage the ranked voting system for trading signals.\n\nSubcommands:\n\
    \  list [verbose]     - List current voter rankings and weights\n\
    \  info               - Show voting system information\n\
    \  presets            - List available voter presets\n\
    \  preset NAME        - Apply a voter preset (default, macd_primary, rsi_primary)\n\
    \  promote VOTER      - Increase voter priority (MACD or RSI)\n\
    \  demote VOTER       - Decrease voter priority (MACD or RSI)\n\
    \  role VOTER ROLE    - Set voter role (active or review)\n\n\
    The ranked voting system allows fine-tuning of indicator weights\n\
    and priorities for signal generation."

/timeframe:
  category: Configuration
  description: Timeframe mode, presets and validation
  usage: /timeframe [mode | list | presets | preset NAME | single TF | validate VALUE]
  examples:
  - /timeframe
  - /timeframe list
  - /timeframe presets
  - /timeframe preset trend_following
  - /timeframe single 1d
  - /timeframe validate 4h
  aliases:
  - /tf
  tags:
  - configuration
  - timeframe
  - analysis
  - slash-command
  related:
  - change timeframe
  - list timeframes
  - /voter
  details: "Subcommands:\n  (none), mode     - Show the timeframe mode (single or multi)\n  list     \
    \        - List the timeframes\n  presets          - List the multi-timeframe presets\n  preset NAME\
    \      - Use a preset: trend_following, intraday, position or scalping\n  single TF        - Back\
    \ to one timeframe (1m, 5m, 15m, 30m, 1h, 2h, 4h, 1d, 1w, 1M)\n  validate VALUE   - Check a timeframe\
    \ value\n\nOnly 1d has been backtested; the signal has no edge there either (see the research docs)."
/backup:
  category: System
  description: Back up and restore the local databases
  usage: /backup [list | create | restore NAME | export TABLE | status | cleanup [DAYS]]
  examples:
  - /backup
  - /backup create
  - /backup list
  - /backup restore user_20261013_143022.db
  - /backup export trading_mode_history
  - /backup cleanup 60
  aliases:
  - backup
  tags:
  - system
  - database
  - backup
  - slash-command
  related: []
  details: "Back up and restore the SQLite state databases.\n\nSubcommands:\n\
    \  /backup                - Show backup status\n\
    \  /backup list           - List backups, newest first, with the database each belongs to\n\
    \  /backup create         - Back up state/user.db (saved trading mode, alerts, watchlists, GTT orders)\n\
    \  /backup restore NAME   - Restore a backup listed by /backup list (the current database is backed up first)\n\
    \  /backup export TABLE   - Export a table of state/user.db to JSON in state/exports/\n\
    \  /backup status         - Show backup status\n\
    \  /backup cleanup [DAYS] - Remove backups older than DAYS (default 30), after listing\
    \ them and asking; the 5 newest of each database always stay\n\n\
    Backups are stored in state/backups/. Configuration YAML files are not included."

# Slash Commands (Issue #506, #507, #508)
/plan:
  category: Configuration
  description: Entry plan, levels, volume and ATR for a symbol
  usage: /plan <symbol> [levels|volume|atr]
  examples:
  - /plan SPY
  - /plan AAPL levels
  - /plan AAPL volume
  - /plan AAPL atr
  aliases:
  - plan
  tags:
  - information
  - slash-command
  details: "Plan a buy from completed daily bars. Nothing here places an order.\n\n\
    \  /plan SYM         - Entry, stop, target and risk/reward (ATR-based)\n\
    \  /plan SYM levels  - Support and resistance\n\
    \  /plan SYM volume  - Volume against its average\n\
    \  /plan SYM atr     - Average true range"

/trailing:
  category: Configuration
  description: Trailing stop settings, climb rates, examples
  usage: /trailing [explain [rate] | compare | example ENTRY PRICE STOP [rate]]
  examples:
  - /trailing
  - /trailing explain fast
  - /trailing compare
  - /trailing example 100 106 95
  aliases:
  - trailing
  tags:
  - information
  - slash-command
  details: "How trailing stops move. Nothing here changes a stop.\n\n\
    \  /trailing                 - Current settings\n\
    \  /trailing explain [rate]  - The tiers of a climb rate (slow, medium, fast)\n\
    \  /trailing compare         - The climb rates side by side\n\
    \  /trailing example ENTRY PRICE STOP [rate] - Where the routines would put that stop,\
    \ from their own code\n\n\
    The evening routine raises stops, while the market is open."

/records:
  category: Configuration
  description: Daily equity, fills and realized P&L
  usage: /records [days|all]
  examples:
  - /records
  - /records 30
  - /records all
  aliases:
  - records
  tags:
  - information
  details: "Show what the routines recorded: equity by day with day P&L, the fills in\
    \ that period, and their realized P&L at average cost. Read-only, and makes no\
    \ broker calls, so it shows the state as of the last routine."

/gtt:
  category: Configuration
  description: GTT order management
  usage: /gtt {list|create|oco|summary|status|delete|cancel|enable|disable} [args]
  examples:
  - /gtt
  - /gtt list
  - /gtt create AAPL above 200
  - /gtt create SPY below 450 breakout watch
  - /gtt oco SPY above 620 below 580
  - /gtt summary
  - /gtt status <id>
  - /gtt delete <id>
  - /gtt cancel <id>
  - /gtt enable <id>
  - /gtt disable <id>
  aliases:
  - gtt
  tags:
  - configuration
  - orders
  - gtt
  - slash-command
  related:
  - show orders
  - cancel
  details: "Manage Good-Till-Triggered persistent order triggers.\n\nSubcommands:\n\
    \  create SYM COND VAL [notes] - Create trigger\n\
    \  oco SYM above P below P [days] - Two price alerts; the first to fire disables the\
    \ other\n\
    \  list              - Show all GTT triggers\n\
    \  summary           - Show GTT summary with counts\n\
    \  status <id>       - Show trigger details\n\
    \  delete <id>       - Delete a trigger\n\
    \  cancel <id>       - Alias for delete\n\
    \  enable <id>       - Enable a disabled trigger\n\
    \  disable <id>      - Disable a trigger\n\n\
    Conditions: above, below (a price); gain, loss, trailing (a percent, 5 = 5%)\n\
    GTT triggers persist across sessions, and are checked at the morning and evening\
    \ routines for symbols you hold; other symbols at the evening routine (when a\
    \ fresh price exists), alerts only."

/watchlist:
  category: Configuration
  description: Watchlist management
  usage: /watchlist {list|add|remove|show|create|delete|limits|scanner} [args]
  examples:
  - /watchlist
  - /watchlist list
  - /watchlist add AAPL
  - /watchlist add MSFT tech
  - /watchlist remove NVDA
  - /watchlist show tech
  - /watchlist create growth High growth stocks
  - /watchlist delete growth
  - /watchlist limits
  - /watchlist scanner
  aliases:
  - wl
  tags:
  - configuration
  - watchlist
  - scanner
  - slash-command
  related: []
  details: "Manage watchlists for trading opportunities.\n\nSubcommands:\n\
    \  list              - Show all watchlists\n\
    \  add <sym> [name]  - Add symbol (default: 'default')\n\
    \  remove <sym> [name] - Remove symbol from watchlist\n\
    \  show <name>       - Show specific watchlist details\n\
    \  create <name> [desc] - Create a new watchlist\n\
    \  delete <name>    - Delete a watchlist, after asking\n\
    \  limits            - Show watchlist statistics\n\
    \  scanner           - Show scanner tier status\n\n\
    User watchlists are for personal tracking.\n\
    Scanner tiers are for automated scan prioritization."

/partial:
  category: Trading
  description: Partial exit management
  usage: /partial {list|summary|active|levels|modify|set|remove} [args]
  examples:
  - /partial
  - /partial list
  - /partial summary
  - /partial AAPL
  - /partial levels AAPL
  - /partial active
  - /partial modify AAPL 1 210.50
  - /partial set AAPL
  - /partial remove AAPL
  aliases:
  - pe
  tags:
  - trading
  - exits
  - partial
  - slash-command
  related:
  - show positions
  - sell
  - show portfolio
  details: "Manage multi-target partial position exits.\n\nSubcommands:\n\
    \  list              - Show all partial exit plans\n\
    \  summary           - Summary of active targets\n\
    \  active            - List only active targets\n\
    \  levels <symbol>   - Show exit target levels for position\n\
    \  modify <sym> <n> <price> - Modify target n exit price\n\
    \  set <symbol>      - Plan a partial exit for a held long position (2+ shares)\n\
    \  remove <symbol>   - Remove a plan, after asking\n\
    \  <symbol>          - Show plan for specific symbol\n\n\
    Partial exits split positions across multiple targets:\n\
    - Target 1: its share of the position (half, rounded down, with the 50/50 split) sold at market by the evening routine once\n\
    \  the price is at the average entry plus the trading mode's target_1_pct (4%, 5% or 6%).\n\
    \  No order rests at the broker; the stop is cancelled for a few seconds around the sale.\n\
    - Target 2: the rest stays on the trailing stop\n\
    The morning routine never sells; it reports a target that was reached."
