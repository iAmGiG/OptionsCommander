# Daily scheduler (src/trading/scheduling/daily_scheduler.py)
# Times are in market_timezone whatever the host's timezone; routines run on NYSE trading
# days only. The enable flags below are defaults: flags saved from the CLI (/schedule),
# the config editor or the setup wizard (in state/user.db) take precedence.
enabled: false
market_timezone: America/New_York
morning_routine_time: '09:20:00'
evening_routine_time: '15:50:00'
morning_routine_enabled: true
evening_routine_enabled: true
max_retries: 3
retry_delay_seconds: 60
# Gates nothing: email and the heartbeat are set in config.json (notifications.*)
enable_notifications: false
# true: routines send no orders and change no saved state (local state, daily records,
# GTT triggers); reports, named <date>_<routine>_dry_run.md, show what they would do
dry_run: false
# Wall-clock limit for one cron check (main.py --run-due), retries included; default 900
# run_due_timeout_seconds: 900
