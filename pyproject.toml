[project]
name = "AutoTrader-AgentEdge"
version = "1.0.0"
description = "Paper trading on Alpaca: scheduled stop management and a human-in-the-loop CLI"
authors = [{name = "iAmGiG"}]
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    # Microsoft Agent Framework (#606): the natural-language parser only (#331)
    "agent-framework-core>=1.23,<2",
    "agent-framework-openai>=1.17,<2",  # brings openai
    # Trading APIs
    "alpaca-py>=0.43.2",
    # Data processing. pandas 3 reproduces every committed research result (checked
    # 2026-10-20 against pandas 2.3) and is the only pandas with Python 3.15 wheels.
    "pandas>=2.2.0,<4",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "pytz>=2025.2",
    # HTTP
    "requests>=2.32.0",
    # Research backtester (src/backtesting/research_backtester.py reads PostgreSQL)
    "psycopg2-binary>=2.9.9",
    # Utility
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# GEX Database Infrastructure (options data, GEX calculations, regime detection).
# Private repo, so optional: CI cannot clone it. Nothing in src/ imports it; only the
# DB integration tests do. Install with `pip install -e ".[gex]"`, or editable from a
# local checkout: `pip install -e ../gex-database-infrastructure`.
gex = [
    "gex-database-infrastructure @ git+https://github.com/iAmGiG/gex-database-infrastructure.git",
]
dev = [
    # Linting and formatting
    "ruff==0.17.1",  # same version as .pre-commit-config.yaml and the workflows
    "pylint>=3.0.0",
    "mypy>=1.8.0",
    "docformatter>=1.7.5",
    # Markdown
    "markdownlint-cli2>=0.12.1",
    # Security
    "bandit[toml]>=1.7.6",
    # Code quality metrics
    "radon>=6.0.1",
    "vulture>=2.10",
    # Pre-commit hooks
    "pre-commit>=3.2.0",  # the hook versions need 3.2+; CI uses 4.7.0
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    # Documentation
    "interrogate>=1.5.0",
    # Utilities
    "ipython>=8.12.0",
]

[tool.ruff]
# Ruff lints, sorts imports (rule I) and formats (`ruff format`, Black-compatible); it
# replaced black and isort (#603). CI runs it through pre-commit, so the version is the
# rev in .pre-commit-config.yaml; keep the dev pin below equal to it.
line-length = 100
target-version = "py312"
# *.md: ruff 0.16+ would also format Python code blocks inside Markdown
# On top of ruff's defaults (venv, build, ...). docs/archived holds old experiment code,
# kept for reference and not maintained.
extend-exclude = [".cache", "reports", "*.md", "docs/archived"]

[tool.ruff.lint]
# E402: module level import not at top of file
# E501: line too long (handled by formatters, GitHub linter will catch in CI)
ignore = ["E402", "E501"]
select = ["E", "F", "I", "W", "C", "N"]

[tool.ruff.lint.isort]
known-local-folder = ["src", "config"]

[tool.ruff.lint.per-file-ignores]
# Line length handled by formatters and GitHub CI
"*" = ["E501"]
# Scripts that set up sys.path before their imports: import order isn't enforced there
# (E402 is ignored everywhere). Ruff's * also matches "/", so top-level scripts are named.
"scripts/research/**/*.py" = ["I001"]
"scripts/populate_historical_cache.py" = ["I001"]
"scripts/verify_free_data_access.py" = ["I001"]
# Issue #414: TrailingStopManager has justified complexity for profit zone logic
"src/trading/orders/trailing_stop_manager.py" = ["C901"]

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "db: marks tests requiring PostgreSQL database (deselect with '-m \"not db\"')",
]

[tool.mypy]
# MyPy static type checking
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
exclude = [
    "deprecated/",
    "tests/",
    "scripts/",
]

[tool.bandit]
# Bandit security scanning
exclude_dirs = [
    "/tests/",
    "/deprecated/",
    "/.venv/",
]
skips = [
    "B101",  # assert_used - we use assert in tests
    "B601",  # paramiko_calls - not applicable
]

[tool.coverage.run]
# Coverage settings
source = ["src"]
omit = [
    "*/tests/*",
    "*/deprecated/*",
    "*/__init__.py",
]

[tool.coverage.report]
# Coverage report settings
precision = 2
show_missing = true
skip_covered = false
