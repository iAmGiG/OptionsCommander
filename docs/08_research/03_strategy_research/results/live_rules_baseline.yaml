run_timestamp: '2026-10-15T01:40:29.071134'
issue: '#574'
description: Live CLI rules backtested with live timing (replaces the 0.856 Sharpe
  claim)
methodology:
  signal: VotingSignal.evaluate_ranked_voting (MACD 13/34/8 hist beyond +/-0.1, RSI
    14 at 30/70), 90-calendar-day window rescaled to the prior day's raw price level
  timing: signal from bars through d-1; fills at day d open
  entries: BUY with no position at the start of the day; whole shares (at the raw
    price) of position_pct x prior equity at the prior close; max 10 positions and
    80% exposure counted before the open; cash
  initial_capital: 100000.0
  exits: SELL signal at the open; else bracket stop -5% / target +8% from the fill
    on the day's range; gaps fill at the open; both touched counts as the stop
  costs_bps_per_side:
  - 0.0
  - 5.0
  - 10.0
  modes_position_pct:
    moderate: 0.02
    conservative: 0.01
  data: equity_prices_daily, split-adjusted (gex.corporate_events), dividends excluded,
    read-only
  periods:
    warmup_from: '2008-01-02'
    test: 2009-01-02 to 2026-10-09
    out_of_sample_from: '2020-01-01'
  sharpe: annualized, rf 0; 95% circular block bootstrap (20-day blocks, 2000 reps)
  alpha: daily OLS on equal-weight universe returns, annualized intercept, Newey-West
    (5 lags) t; cash earns 0
  not_modelled:
  - trailing-stop adjustments from the morning routine
  - intraday decisions (the CLI can also trade on a partial day)
  - IEX vs consolidated bars
  - 'GTC renewal (assumed, as #587 now does)'
  caveats:
  - universe picked with hindsight; benchmark is buy-and-hold of the same symbols
  - MACD threshold is in dollars, so signal frequency depends on price level
